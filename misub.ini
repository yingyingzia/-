[custom]

;启用规则生成
enable_rule_generator=true

;覆盖订阅原有规则
overwrite_original_rules=true

;==================================================
; Surge 托管更新（生成后的 conf 必须第一行是下面这句）
; 把 URL 换成你自己的 MiSub Surge 订阅链接
; #!MANAGED-CONFIG https://你的misub域名/订阅路径?target=surge interval=86400
;==================================================

;==================================================
; 小红书（优先匹配，尽量全量）
;==================================================

ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xiaohongshu.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhslink.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhscdn.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhscdn.net
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhsrcdn.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhsstatic.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhspic.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,xhsvideo.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,fengkongcloud.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,redelight.cn
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,rednote.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,rednote.com.my
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,rednotecdn.com
ruleset=XiaoHongShu,[]DOMAIN-SUFFIX,qianfan.com
ruleset=XiaoHongShu,[]DOMAIN-KEYWORD,xiaohongshu
ruleset=XiaoHongShu,[]DOMAIN-KEYWORD,xhslink
ruleset=XiaoHongShu,[]DOMAIN-KEYWORD,xhscdn
ruleset=XiaoHongShu,[]DOMAIN-KEYWORD,rednote

;==================================================
; Bybit Global + Bybit EU（尽量全量）
;==================================================

ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.eu
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.global
ruleset=Bybit,[]DOMAIN-SUFFIX,bybitglobal.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit-global.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bytick.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bycsi.com
ruleset=Bybit,[]DOMAIN-SUFFIX,byapis.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bycbe.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bymj.io
ruleset=Bybit,[]DOMAIN-SUFFIX,byabcde.com
ruleset=Bybit,[]DOMAIN-SUFFIX,byapps.net
ruleset=Bybit,[]DOMAIN-SUFFIX,byd3c3.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.biz
ruleset=Bybit,[]DOMAIN-SUFFIX,bybdc6.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.cloud
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.co.kr
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.com.br
ruleset=Bybit,[]DOMAIN-SUFFIX,bybitapi.com
ruleset=Bybit,[]DOMAIN-SUFFIX,bybit.net
ruleset=Bybit,[]DOMAIN-SUFFIX,bybits.org
ruleset=Bybit,[]DOMAIN,bybit-exchange.github.io
ruleset=Bybit,[]DOMAIN,bybit.ada.support
ruleset=Bybit,[]DOMAIN-KEYWORD,bybit
ruleset=Bybit,[]DOMAIN-KEYWORD,bytick

;==================================================
; 基础规则
;==================================================

ruleset=DIRECT,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Unbreak.list

;==================================================
; 流媒体
;==================================================

ruleset=YouTube,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/StreamingMedia/Video/YouTube.list
ruleset=Netflix,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/StreamingMedia/Video/Netflix.list
ruleset=Disney,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/StreamingMedia/Video/DisneyPlus.list
ruleset=Bahamut,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/StreamingMedia/Video/Bahamut.list
ruleset=Bilibili,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/StreamingMedia/StreamingSE.list

;==================================================
; Telegram / Steam
;==================================================

ruleset=Telegram,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Extra/Telegram/Telegram.list
ruleset=Steam,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Extra/Game/Steam.list

;==================================================
; PayPal
;==================================================

ruleset=PayPal,[]DOMAIN-SUFFIX,paypal.com
ruleset=PayPal,[]DOMAIN-SUFFIX,paypalobjects.com
ruleset=PayPal,[]DOMAIN-SUFFIX,pypl.com

;==================================================
; OpenAI / Apple
;==================================================

ruleset=OpenAI,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Extra/OpenAI/OpenAI.list
ruleset=Apple,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Extra/Apple/Apple.list

;==================================================
; 国际及中国规则
;==================================================

ruleset=Proxies,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/Global.list
ruleset=DIRECT,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/China.list
ruleset=DIRECT,https://raw.githubusercontent.com/AGWA5783/Profiles/master/Surge/Ruleset/LocalAreaNetwork.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=Final,[]MATCH

;==================================================
; 策略组：每个组都能选地区组 + 全部节点 + DIRECT
; `.*` = 订阅里所有节点
;==================================================

custom_proxy_group=Proxies`select`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT

custom_proxy_group=YouTube`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT
custom_proxy_group=Netflix`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT
custom_proxy_group=Disney`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT
custom_proxy_group=Bahamut`select`[]Proxies`[]HK`[]TW`.*`[]DIRECT
custom_proxy_group=Bilibili`select`[]DIRECT`[]HK`[]TW`[]Proxies`.*
custom_proxy_group=Telegram`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT
custom_proxy_group=Steam`select`[]Proxies`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US`.*
custom_proxy_group=PayPal`select`[]HK`[]SG`[]US`[]Proxies`[]DIRECT`[]JP`[]TW`.*
custom_proxy_group=Bybit`select`[]Proxies`[]HK`[]JP`[]SG`[]TW`[]US`.*`[]DIRECT
custom_proxy_group=OpenAI`select`[]Proxies`[]US`[]JP`[]SG`[]HK`[]TW`.*`[]DIRECT
custom_proxy_group=Apple`select`[]DIRECT`[]HK`[]JP`[]SG`[]TW`[]US`[]Proxies`.*
custom_proxy_group=XiaoHongShu`select`[]HK`[]TW`[]SG`[]Proxies`.*`[]DIRECT
custom_proxy_group=Final`select`[]Proxies`[]DIRECT`.*

;==================================================
; 地区节点组（方便筛选，策略组里仍可用 .* 选全部）
;==================================================

custom_proxy_group=HK`select`港|香港|HK|Hong Kong`http://www.gstatic.com/generate_204`600
custom_proxy_group=SG`select`新|新加坡|狮城|獅城|SG|Singapore`http://www.gstatic.com/generate_204`600
custom_proxy_group=TW`select`台|台湾|台灣|新北|彰化|深台|CHT|HINET|TW|Taiwan`http://www.gstatic.com/generate_204`600
custom_proxy_group=JP`select`日((?!用).)+|[^-]日|东京|東京|大阪|埼玉|JP|Japan`http://www.gstatic.com/generate_204`600
custom_proxy_group=US`select`美|美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|US|USA|United States`http://www.gstatic.com/generate_204`600
